name: Backend CI

# No `paths` filter on purpose. It used to be `paths: ["backend/**"]`, which meant a
# PR touching only docs/, README.md or this workflow ran zero checks — so the phase
# docs the plan requires were the one thing CI could not verify, and once branch
# protection requires a passing check, such a PR cannot merge at all (a required
# check that never reports blocks the merge rather than passing it).
#
# The whole job is ~90 seconds, so running it on every PR is cheaper than the
# confusion. If a frontend workflow lands later, split by job, not by path filter.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ci_test_secret
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Lint
        run: pnpm run lint

      - name: Type check / build
        run: pnpm run build

      - name: Run tests
        run: pnpm test

      - name: Build Docker image
        working-directory: .
        run: docker build -t backend-ci-check ./backend
