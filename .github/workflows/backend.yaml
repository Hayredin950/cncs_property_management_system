name: Backend CI

# No `paths` filter on purpose. It used to be `paths: ["backend/**"]`, which meant a
# PR touching only docs/, README.md or this workflow ran zero checks — so the phase
# docs the plan requires were the one thing CI could not verify, and once branch
# protection requires a passing check, such a PR cannot merge at all (a required
# check that never reports blocks the merge rather than passing it).
#
# The whole job is ~90 seconds, so running it on every PR is cheaper than the
# confusion. If a frontend workflow lands later, split by job, not by path filter.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Placeholders, not credentials.
      #
      # Nothing in this job talks to a database: the suite mocks Prisma, `lint` and
      # `tsc` only read source, and the docker step only builds an image. What the
      # job *does* need is for `prisma.config.ts` to load, and it resolves
      # `env("DIRECT_URL")` eagerly while the config is being read — so an unset
      # variable throws `PrismaConfigEnvError: Cannot resolve environment variable:
      # DIRECT_URL` and kills the job in ~25s, before a single test runs. That is
      # what happened here: this repo has no `DIRECT_URL` secret, so the workflow
      # mapped it to an empty string and failed every run since it was written.
      #
      # `backend/Dockerfile` already solves this the same way for the image build,
      # for the same reason — see the comment above its `prisma generate`. A real URL
      # (or a real secret) still wins when one is configured, so a future job that
      # does want the database can set the secret and get it.
      DIRECT_URL: ${{ secrets.DIRECT_URL || 'postgresql://ci_placeholder:ci_placeholder@localhost:5432/ci_placeholder' }}
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://ci_placeholder:ci_placeholder@localhost:5432/ci_placeholder' }}
      JWT_SECRET: ci_test_secret
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Lint
        run: pnpm run lint

      - name: Type check / build
        run: pnpm run build

      - name: Run tests
        run: pnpm test

      - name: Build Docker image
        working-directory: .
        run: docker build -t backend-ci-check ./backend
