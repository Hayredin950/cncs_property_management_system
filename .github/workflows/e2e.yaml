name: E2E CI

# The end-to-end flow check.
#
# The unit suites mock Prisma, so they cannot catch a query that is wrong
# **in SQL** — and that is not hypothetical:
#
#   * the approvals queue filtered on `reviewNote NOT LIKE '%[ESCALATED]%'`,
#     which is NULL for a row with no note, so SQL dropped it — a Department
#     Head never saw a newly submitted account request, and only a SYSTEM_ADMIN
#     could approve one. Every test was green, because the mocked suite never
#     executes the WHERE clause;
#   * four endpoints were 500ing in production on columns that did not exist;
#   * the migration history could not build a database at all.
#
# This job builds a real database from the migrations, seeds it, starts the
# real server against it, and drives the real flows over HTTP.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  flows:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # The script brings up its own Postgres in Docker, so nothing here needs
      # a real database and the job cannot touch a developer's data.
      E2E_PG_CONTAINER: cncs-e2e-pg
      E2E_PG_PASSWORD: e2e
      E2E_PG_PORT: "55433"
      E2E_PORT: "4199"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the backend
        working-directory: backend
        run: pnpm run build

      - name: Run the end-to-end flows
        working-directory: .
        run: ./scripts/e2e-flows.sh
