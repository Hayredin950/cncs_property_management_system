name: Frontend CI

# No `paths` filter, deliberately — same reasoning as backend.yaml: a required check
# that never reports blocks a merge rather than passing it, so a PR touching only
# docs/ still needs this job to run and pass. See
# docs/Frontend_Three_Phase_Plan.md §1.3 and docs/frontend-phase-1.md.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_BASE_URL: http://localhost:4000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check / build
        run: pnpm run build

      - name: Run tests
        run: pnpm test

      - name: Build Docker image
        working-directory: .
        run: docker build -t frontend-ci-check ./frontend
