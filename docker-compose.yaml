services:
  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      # `VITE_API_BASE_URL` is baked into the browser bundle and called from the
      # user's machine, not from inside this container — so it must be the
      # backend's *published host port* (4000:4000 above), never the Docker
      # service name/network. See docs/frontend-phase-1.md.
      VITE_API_BASE_URL: http://localhost:4000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
